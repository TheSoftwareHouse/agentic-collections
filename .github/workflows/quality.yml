name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test the check scripts
        run: python3 -m unittest discover -s scripts/tests
      - name: Lint descriptions
        run: python3 scripts/lint-descriptions.py --github
      - name: Check routing eval cases
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # On a pull request, hold the coverage baseline to shrink-only against the base branch.
          base_args=""
          if [ -n "$BASE_REF" ]; then
            git fetch --depth=1 origin "$BASE_REF"
            if git show "origin/$BASE_REF:scripts/eval-coverage-baseline.json" > /tmp/base-baseline.json 2>/dev/null; then
              base_args="--base-baseline /tmp/base-baseline.json"
            fi
          fi
          python3 scripts/check-eval-cases.py --github $base_args

  validate-plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: |
          # Pinned like the model: a CLI rollout must not look like a plugin regression.
          # Raise it deliberately after re-running the suites locally on the new version.
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.280
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Validation is offline: no API key is needed.
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p" || exit 1; done

  project-context-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the stock python3 on macOS, the floor the project-context scripts promise.
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Require node
        # The hook tests skip without node; fail here rather than pass with them skipped.
        run: node --version
      - name: Install Claude Code
        if: matrix.python-version == '3.x'
        run: |
          # Pinned like the model: a CLI rollout must not look like a plugin regression.
          # Raise it deliberately after re-running the suites locally on the new version.
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.280
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Offline by construction: temporary HOME, a fake git identity, no credential helper,
      # no SSH agent, and no clone, fetch, pull or push. See .claude/rules/project-context-contract.md.
      - name: Project-context contract tests
        run: python3 tests/project-context/test_project_context.py -v
      - name: Init scaffold smoke test
        # On the 3.x leg it also validates the generated marketplace with the pinned CLI.
        run: >
          python3 plugins/tsh-product-management/skills/initializing-project-context/tests/smoke_test.py
          ${{ matrix.python-version == '3.x' && '--with-claude' || '' }}
