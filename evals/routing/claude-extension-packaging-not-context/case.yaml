schema_version: "1.1"
name: claude-extension-packaging-not-context
description: Turning a procedure pasted into chat into something several repositories reuse must route to authoring-claude-extensions, not managing-claude-context.
tags: [routing]
plugins: ["../../../plugins/tsh-core"]
runs: 1
execution:
  prompt: |
    Every week someone pastes the same 25-line release checklist into chat so Claude follows it.
    Turn it into something reusable that Claude picks up on its own, and that all three repositories our team works in can share.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: extension-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?authoring-claude-extensions"'
    arm: with-only
  - name: context-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?managing-claude-context"'
    min: 0
    max: 0
