schema_version: "1.1"
name: domain-dictionary-not-claude-context
description: Building a business-term glossary reconciled against the code must route to managing-domain-dictionaries, not to Claude-context setup, knowledge-base writing or discovery research.
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-product-management", "../../../plugins/tsh-core"]
runs: 1
execution:
  prompt: |
    The client says "mandate", "order" and "instruction" for the same thing, and our code
    calls it PaymentRequest. Build us a glossary of the canonical business terms from the
    workshop material and reconcile it against the codebase.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?managing-domain-dictionaries"'
    arm: with-only
  - name: managing-claude-context-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?managing-claude-context"'
    min: 0
    max: 0
  - name: writing-project-knowledge-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-project-knowledge"'
    min: 0
    max: 0
  - name: analyzing-discovery-context-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analyzing-discovery-context"'
    min: 0
    max: 0
