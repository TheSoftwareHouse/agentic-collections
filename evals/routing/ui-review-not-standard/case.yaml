schema_version: "1.1"
name: ui-review-not-standard
description: A request to check a page against its Figma design must route to reviewing-ui, which runs the full compare pass, not stop at capturing-ui-evidence.
tags: [routing]
plugins: ["../../../plugins/tsh-product-engineering"]
runs: 1
execution:
  prompt: |
    I just finished the new pricing page at http://localhost:5173/pricing. Does it match the Figma design at https://www.figma.com/design/AbC123/Pricing?node-id=12-34?
    Check it and tell me what differs.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: reviewing-ui-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?reviewing-ui"'
    arm: with-only
  - name: capturing-ui-evidence-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?capturing-ui-evidence"'
    min: 0
    max: 0
