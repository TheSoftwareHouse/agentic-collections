schema_version: "1.1"
name: frontend-bug-debugging-first
description: A bug with no known cause in a React app must still route to debugging-code first, although implementing-frontend now claims any code in a browser app. implementing-frontend may load alongside it; it must not displace it.
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-product-engineering", "../../../plugins/tsh-stack-frontend"]
runs: 1
execution:
  prompt: |
    In our React + Vite storefront, the cart badge in the header keeps showing the old item count after a product is removed from the cart; it only updates after a page reload.
    It worked before last week's release. Fix it.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: debugging-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?debugging-code"'
    arm: with-only
  - name: implementation-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestrating-feature-implementation"'
    min: 0
    max: 0
