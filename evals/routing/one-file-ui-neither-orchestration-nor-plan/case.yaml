schema_version: "1.1"
name: one-file-ui-neither-orchestration-nor-plan
description: A one-file UI change phrased as "show X on Y", where the field already reaches the browser, must load neither feature orchestration nor the planning skill on turn one; the orchestrator's "add X to Y" trigger is bounded to changes that span layers. No must-fire grader, because on a change this small the model reads code before it loads any skill (implementing-frontend fired 0 of 12 on turn one across two wordings; every run searched for the component first).
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-product-engineering", "../../../plugins/tsh-stack-frontend"]
runs: 1
execution:
  prompt: |
    In our React admin app, show each user's last-seen time as a new column in the admin users table. The API
    already returns lastSeenAt on every user; format it as a relative time like "5 minutes ago".
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: orchestrating-feature-implementation-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestrating-feature-implementation"'
    min: 0
    max: 0
  - name: creating-implementation-plans-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?creating-implementation-plans"'
    min: 0
    max: 0
