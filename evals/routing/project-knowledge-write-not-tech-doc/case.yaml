schema_version: "1.1"
name: project-knowledge-write-not-tech-doc
description: Recording a client decision in the project knowledge base must route to writing-project-knowledge, not to tsh-core's general writing-technical-documents.
tags: [routing]
plugins: ["../../../plugins/tsh-product-management", "../../../plugins/tsh-core"]
runs: 1
execution:
  prompt: |
    In today's call the client confirmed that refunds over 500 EUR need a second
    approver. Write that down in the acme-context knowledge base so the whole team has
    it.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-project-knowledge"'
    arm: with-only
  - name: sibling-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-technical-documents"'
    min: 0
    max: 0
