schema_version: "1.1"
name: ios-feature-orchestrated
description: A multi-file feature in a SwiftUI app must route to orchestrating-feature-implementation, although implementing-ios claims any change to iOS app code and building a screen or feature. implementing-ios may load alongside it; it must not displace it.
# Modelled on frontend-feature-orchestrated, without its "reuse the existing ..." line:
# with it, 4 of 6 runs searched the empty sandbox and hit the turn cap before any Skill call.
# Quarantined on 2026-11-23 at 2 of 6. The failing runs searched the empty sandbox
# before any Skill call, with or without tsh-stack-ios in the session: the
# orchestrator's description said "before the first file is edited", which left
# reading the code first open. Lifted after it was changed to "load it first,
# before exploring the codebase or editing any file" in tsh-product-engineering 0.13.0.
# Measured on claude-sonnet-5-5, Claude Code 2.1.323: before, 6 of 6 and 2 of 6 in two
# series (6 of 12 without tsh-stack-ios); after, 24 of 24.
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-product-engineering", "../../../plugins/tsh-stack-ios"]
runs: 1
execution:
  prompt: |
    In our SwiftUI shopping app, build a wishlist: a heart button on every product cell, a Wishlist tab listing the saved products, and a badge on that tab with the count.
    Persist it through the /api/wishlist endpoints (GET, POST and DELETE). There's no design yet.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: orchestration-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestrating-feature-implementation"'
    arm: with-only
  - name: debugging-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?debugging-code"'
    min: 0
    max: 0
