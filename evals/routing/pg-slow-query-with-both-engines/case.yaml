schema_version: "1.1"
name: pg-slow-query-with-both-engines
description: With both database plugins installed, a plainly worded slow-report question on PostgreSQL must route to optimizing-postgresql-queries and fire none of the MySQL skills.
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-stack-postgresql", "../../../plugins/tsh-stack-mysql"]
runs: 1
execution:
  prompt: |
    The customers report in our back office takes 6 seconds to load and it's getting worse every month.
    The database is PostgreSQL. It sums order totals per customer for one day out of roughly 40 million orders.
    How do I find out what's wrong and fix it?
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?optimizing-postgresql-queries"'
    arm: with-only
  - name: optimizing-mysql-queries-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?optimizing-mysql-queries"'
    min: 0
    max: 0
  - name: migrating-mysql-schemas-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?migrating-mysql-schemas"'
    min: 0
    max: 0
  - name: designing-mysql-schemas-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?designing-mysql-schemas"'
    min: 0
    max: 0
