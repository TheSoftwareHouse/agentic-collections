schema_version: "1.1"
name: rn-feature-orchestrated
description: A multi-screen feature in a React Native app must route to orchestrating-feature-implementation, although implementing-react-native claims any app code on a phone. implementing-react-native may load alongside it; it must not displace it.
# Quarantined 2026-11-17: orchestrating-feature-implementation fires in 3-5 of 6 runs on claude-sonnet-5-5;
# most failing runs call no Skill on turn one, as frontend-feature-orchestrated does without this plugin.
# Restore routing once that is fixed in tsh-product-engineering and this case measures 6 of 6.
tags: [known-failure, cross-plugin]
plugins: ["../../../plugins/tsh-product-engineering", "../../../plugins/tsh-stack-react-native"]
runs: 1
execution:
  prompt: |
    In our React Native app, build a wishlist: a heart button on every product card, a Wishlist screen listing the saved products, and a tab badge with the count.
    Persist it through the existing /api/wishlist endpoints. There's no design yet; reuse the existing product card and tab bar components.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: orchestration-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestrating-feature-implementation"'
    arm: with-only
  - name: debugging-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?debugging-code"'
    min: 0
    max: 0
