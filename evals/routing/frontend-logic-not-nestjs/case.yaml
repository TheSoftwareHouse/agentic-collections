schema_version: "1.1"
name: frontend-logic-not-nestjs
description: Non-UI frontend code — an API client and a store in a React app — must route to implementing-frontend, not implementing-nestjs-api, although nothing renders and the monorepo also holds a NestJS service.
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-stack-frontend", "../../../plugins/tsh-stack-nodejs"]
runs: 1
execution:
  prompt: |
    Our monorepo has apps/web (React + Vite) and apps/api (NestJS).
    In apps/web, add a typed client for the /products endpoints and a cart store that holds the items and computes the totals. No screen uses them yet, so nothing renders differently.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: frontend-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?implementing-frontend"'
    arm: with-only
  - name: nestjs-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?implementing-nestjs-api"'
    min: 0
    max: 0
