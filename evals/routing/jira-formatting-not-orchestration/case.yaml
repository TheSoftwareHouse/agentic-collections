schema_version: "1.1"
name: jira-formatting-not-orchestration
description: Turning an approved story list into Jira-ready issues must route to formatting-jira-issues, not to the end-to-end orchestrator.
tags: [routing]
plugins: ["../../../plugins/tsh-product-management"]
runs: 1
execution:
  prompt: |
    Our epics and stories for the checkout revamp are approved. Map them onto our Jira
    issue template — fields, Jira markdown, a completeness check — so they are ready to
    push.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?formatting-jira-issues"'
    arm: with-only
  - name: sibling-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestrating-business-analysis"'
    min: 0
    max: 0
