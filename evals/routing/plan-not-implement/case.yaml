schema_version: "1.1"
name: plan-not-implement
description: A request for a task breakdown before any code is written must route to creating-implementation-plans, not orchestrating-feature-implementation.
tags: [routing]
plugins: ["../../../plugins/tsh-product-engineering"]
runs: 1
execution:
  prompt: |
    Ticket PAY-142: customers can request a refund for a paid order, and we issue it through Stripe.
    Nobody should write code for it yet. First I want it broken down into a plan: phased tasks, each with a definition of done, that two people can pick up in parallel.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: plan-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?creating-implementation-plans"'
    arm: with-only
  - name: implement-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestrating-feature-implementation"'
    min: 0
    max: 0
