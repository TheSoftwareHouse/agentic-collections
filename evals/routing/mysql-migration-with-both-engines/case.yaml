schema_version: "1.1"
name: mysql-migration-with-both-engines
description: With both database plugins installed, a migration question about a MySQL table must route to migrating-mysql-schemas and fire none of the PostgreSQL skills, whose lock modes and recipes do not apply.
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-stack-mysql", "../../../plugins/tsh-stack-postgresql"]
runs: 1
execution:
  prompt: |
    We're on MySQL 8 with InnoDB. I need to add an index on orders.customer_id; the table has about
    80 million rows and is busy all day. Will ALTER TABLE lock it, and should we use gh-ost?
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?migrating-mysql-schemas"'
    arm: with-only
  - name: migrating-postgresql-schemas-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?migrating-postgresql-schemas"'
    min: 0
    max: 0
  - name: optimizing-postgresql-queries-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?optimizing-postgresql-queries"'
    min: 0
    max: 0
  - name: designing-postgresql-schemas-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?designing-postgresql-schemas"'
    min: 0
    max: 0
