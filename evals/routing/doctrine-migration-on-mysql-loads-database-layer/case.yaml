schema_version: "1.1"
name: doctrine-migration-on-mysql-loads-database-layer
description: A Doctrine migration that changes a column type on a large live MySQL table must load migrating-mysql-schemas, not the PHP architecture skill.
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-stack-mysql", "../../../plugins/tsh-stack-php"]
runs: 1
execution:
  prompt: |
    Our Symfony app's next Doctrine migration changes shipments.weight from INT to DECIMAL(10,3). The table is
    on MySQL 8.4, has around 60 million rows and is written to constantly. How do we ship that without locking it up?
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?migrating-mysql-schemas"'
    arm: with-only
  - name: architecting-php-code-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?architecting-php-code"'
    min: 0
    max: 0
