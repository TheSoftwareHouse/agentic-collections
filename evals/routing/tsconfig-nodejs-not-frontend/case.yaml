schema_version: "1.1"
name: tsconfig-nodejs-not-frontend
description: A decorator-metadata problem in the NestJS service of a monorepo that also holds a Vite app must route to configuring-typescript-for-nodejs, not configuring-typescript-for-frontend.
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-stack-frontend", "../../../plugins/tsh-stack-nodejs"]
runs: 1
execution:
  prompt: |
    Our monorepo has apps/web (React + Vite) and apps/api (NestJS with TypeORM).
    After bumping TypeScript in apps/api, every injected service in our NestJS controllers is undefined at runtime and TypeORM entity columns come back undefined. Sort out the api's tsconfig.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: nodejs-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?configuring-typescript-for-nodejs"'
    arm: with-only
  - name: frontend-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?configuring-typescript-for-frontend"'
    min: 0
    max: 0
