schema_version: "1.1"
name: claude-extension-not-context
description: An action that must run every time without Claude remembering it must route to authoring-claude-extensions, not managing-claude-context.
# Quarantined 2026-10-09: Claude Code's built-in update-config skill wins in 15 of 15 runs on
# claude-sonnet-5-5, because a hook in settings.json is what it owns. Restore the routing tag
# once tsh-core decides whether authoring-claude-extensions should claim hook requests.
tags: [known-failure]
plugins: ["../../../plugins/tsh-core"]
runs: 1
execution:
  prompt: |
    Every time Claude edits a TypeScript file in this repo, run prettier on that file.
    It has to happen automatically, every time, not only when Claude remembers to. Set that up.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: extension-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?authoring-claude-extensions"'
    arm: with-only
  - name: context-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?managing-claude-context"'
    min: 0
    max: 0
