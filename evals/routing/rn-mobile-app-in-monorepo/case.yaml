schema_version: "1.1"
name: rn-mobile-app-in-monorepo
description: A request scoped to the React Native app in a monorepo that also holds a Vite web app must route to implementing-react-native, not implementing-frontend.
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-stack-react-native", "../../../plugins/tsh-stack-frontend"]
runs: 1
execution:
  prompt: |
    Our monorepo has apps/web (React + Vite) and apps/mobile (React Native, bare workflow).
    In apps/mobile, add a Settings screen with a notifications toggle and a Log out button that clears the saved session. No design for it, keep the style of the other screens.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: rn-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?implementing-react-native"'
    arm: with-only
  - name: frontend-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?implementing-frontend"'
    min: 0
    max: 0
