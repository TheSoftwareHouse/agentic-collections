schema_version: "1.1"
name: frontend-hook-not-nestjs
description: A custom-hook request with no design in a monorepo that also holds a NestJS service must route to implementing-frontend, not implementing-nestjs-api.
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-stack-frontend", "../../../plugins/tsh-stack-nodejs"]
runs: 1
execution:
  prompt: |
    Our monorepo has apps/web (React + Vite) and apps/api (NestJS).
    In apps/web, write a useDebounce hook and use it in the product search input so the search request only goes out once the user has stopped typing for 300 ms. There's no design for this, the UI stays as it is.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: frontend-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?implementing-frontend"'
    arm: with-only
  - name: nestjs-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?implementing-nestjs-api"'
    min: 0
    max: 0
