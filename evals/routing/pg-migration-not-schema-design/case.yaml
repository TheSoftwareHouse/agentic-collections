schema_version: "1.1"
name: pg-migration-not-schema-design
description: Asking whether a migration will block a busy table must route to migrating-postgresql-schemas, not to schema design, query tuning, debugging or the general code review, although it is a pasted change that adds a constraint and an index.
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-stack-postgresql", "../../../plugins/tsh-product-engineering"]
runs: 1
execution:
  prompt: |
    This runs on deploy against our orders table, about 80 million rows and busy all day:

    ALTER TABLE orders ADD CONSTRAINT orders_customer_fk FOREIGN KEY (customer_id) REFERENCES customers (id);
    CREATE INDEX orders_customer_id_idx ON orders (customer_id);

    Will this freeze checkout while it runs? If so, what should we ship instead?
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?migrating-postgresql-schemas"'
    arm: with-only
  - name: designing-postgresql-schemas-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?designing-postgresql-schemas"'
    min: 0
    max: 0
  - name: optimizing-postgresql-queries-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?optimizing-postgresql-queries"'
    min: 0
    max: 0
  - name: debugging-code-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?debugging-code"'
    min: 0
    max: 0
  - name: reviewing-code-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?reviewing-code"'
    min: 0
    max: 0
