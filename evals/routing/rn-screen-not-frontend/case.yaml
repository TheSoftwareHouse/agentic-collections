schema_version: "1.1"
name: rn-screen-not-frontend
description: A screen request in a React Native app must route to implementing-react-native, not implementing-frontend, when both stack plugins are installed.
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-stack-react-native", "../../../plugins/tsh-stack-frontend"]
runs: 1
execution:
  prompt: |
    In our React Native app (Expo), add an Order History screen: a list of the user's past orders with date, total and status, and a pull-to-refresh.
    There's no design for it, so match the look of the existing Profile screen.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: rn-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?implementing-react-native"'
    arm: with-only
  - name: frontend-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?implementing-frontend"'
    min: 0
    max: 0
