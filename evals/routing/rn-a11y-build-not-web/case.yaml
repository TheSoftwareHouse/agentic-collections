schema_version: "1.1"
name: rn-a11y-build-not-web
description: Making a React Native screen work with VoiceOver, TalkBack and large text must route to ensuring-react-native-accessibility, not the web accessibility skills.
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-stack-react-native", "../../../plugins/tsh-stack-frontend", "../../../plugins/tsh-product-testing"]
runs: 1
execution:
  prompt: |
    Our React Native checkout screen has to work with VoiceOver and TalkBack, and the text must grow with the system font size.
    Make the Pay button and the error messages readable by the screen readers, and keep the tap targets big enough.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: rn-a11y-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ensuring-react-native-accessibility"'
    arm: with-only
  - name: web-ensure-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ensuring-accessibility"'
    min: 0
    max: 0
  - name: web-audit-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?auditing-accessibility"'
    min: 0
    max: 0
