schema_version: "1.1"
name: mysql-slow-query-not-debugging
description: A list endpoint that slows down page by page on MySQL, with the SQL pasted, must route to optimizing-mysql-queries, not to debugging-code, although it is reported as something that got worse, and not to migrations.
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-stack-mysql", "../../../plugins/tsh-product-engineering"]
runs: 1
execution:
  prompt: |
    Our admin order list got slow. It's MySQL 8.0 on Aurora. Page 1 is instant, page 2000 takes about 9 seconds:

    SELECT * FROM orders WHERE status = 'paid' ORDER BY created_at DESC LIMIT 50 OFFSET 99950;

    There's an index on created_at. Why is it slow and what do we change?
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?optimizing-mysql-queries"'
    arm: with-only
  - name: debugging-code-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?debugging-code"'
    min: 0
    max: 0
  - name: migrating-mysql-schemas-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?migrating-mysql-schemas"'
    min: 0
    max: 0
