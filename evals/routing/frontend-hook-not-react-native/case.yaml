schema_version: "1.1"
name: frontend-hook-not-react-native
description: A custom-hook request in a React + Vite web app must route to implementing-frontend, not implementing-react-native, when both stack plugins are installed.
tags: [routing, cross-plugin]
plugins: ["../../../plugins/tsh-stack-react-native", "../../../plugins/tsh-stack-frontend"]
runs: 1
execution:
  prompt: |
    Our web storefront is React + Vite. Write a useDebounce hook and use it in the product search input so the search request only goes out once the user has stopped typing for 300 ms.
    There's no design for this, the UI stays as it is.
  max_turns: 1
  allowed_tools: [Skill]
graders:
  - name: frontend-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?implementing-frontend"'
    arm: with-only
  - name: rn-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?implementing-react-native"'
    min: 0
    max: 0
