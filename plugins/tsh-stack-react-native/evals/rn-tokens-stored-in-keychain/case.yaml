schema_version: "1.1"
name: rn-tokens-stored-in-keychain
description: Asked for a login that survives restarts in a React Native app that lists both react-native-keychain and AsyncStorage, implementing-react-native fires, the session token is saved through react-native-keychain, nothing under src/auth/ saves it through AsyncStorage or MMKV, no .env file is created, and nothing is installed.
tags: [behaviour]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  prompt: |
    Add login in src/auth/: email and password against POST /auth/login (use the client in
    src/api/client.ts), which returns an access token. Keep the token handling in
    src/auth/session.ts, and keep the user logged in across app restarts.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite]
graders:
  - name: implementing-react-native-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?implementing-react-native"'
  - name: auth-files-created
    type: file_exists
    path: "src/auth/**"
  - name: session-imports-keychain
    type: regex
    target: { source: file, path: src/auth/session.ts }
    pattern: 'from\s+[''"]react-native-keychain[''"]'
  - name: session-saves-the-token-through-keychain
    type: regex
    target: { source: file, path: src/auth/session.ts }
    pattern: '\b(?:setGenericPassword|setInternetCredentials)\s*\('
  - name: session-does-not-use-async-storage-or-mmkv
    type: regex
    target: { source: file, path: src/auth/session.ts }
    pattern: 'AsyncStorage\s*\.\s*(?:setItem|multiSet|mergeItem)|from\s+[''"](?:@react-native-async-storage/async-storage|react-native-mmkv)[''"]|\bnew\s+MMKV\b|\bcreateMMKV\b'
    match: not_contains
  - name: no-auth-file-writes-a-token-to-async-storage-or-mmkv
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*/src/auth/[^"]*"[\s\S]*(?:AsyncStorage\s*\.\s*(?:setItem|multiSet|mergeItem)|from\s+\\*[\''"](?:@react-native-async-storage/async-storage|react-native-mmkv)|\bnew\s+MMKV\b|\bcreateMMKV\b)'
    min: 0
    max: 0
  - name: no-auth-edit-writes-a-token-to-async-storage-or-mmkv
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*/src/auth/[^"]*"[\s\S]*(?:AsyncStorage\s*\.\s*(?:setItem|multiSet|mergeItem)|from\s+\\*[\''"](?:@react-native-async-storage/async-storage|react-native-mmkv)|\bnew\s+MMKV\b|\bcreateMMKV\b)'
    min: 0
    max: 0
  - name: no-command-writes-a-token-to-async-storage-or-mmkv
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*src/auth/(?:[^"\\]|\\.)*(?:AsyncStorage\s*\.\s*(?:setItem|multiSet|mergeItem)|from\s+\\*[\''"](?:@react-native-async-storage/async-storage|react-native-mmkv)|\bnew\s+MMKV\b|\bcreateMMKV\b)'
    min: 0
    max: 0
  - name: no-env-file-at-root
    type: file_exists
    path: ".env*"
    exists: false
  - name: no-env-file-in-a-folder
    type: file_exists
    path: "**/.env*"
    exists: false
  - name: nothing-installed
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*\b(?:npm|pnpm|yarn|bun)\s+(?:i|install|add|ci)\b'
    min: 0
    max: 0
  - name: unchanged-package-json
    type: regex
    target: { source: file, path: package.json }
    pattern: '^\{\n  "name": "field-app",\n  "private": true,\n  "scripts": \{ "typecheck": "tsc --noEmit", "lint": "eslint src" \},\n  "dependencies": \{\n    "@react-native-async-storage\/async-storage": "2\.2\.0",\n    "react": "19\.3\.1",\n    "react-native": "0\.88\.0",\n    "react-native-keychain": "10\.0\.0",\n    "react-native-safe-area-context": "5\.6\.0"\n  \},\n  "devDependencies": \{\n    "@react-native\/typescript-config": "0\.88\.0",\n    "typescript": "6\.0\.3"\n  \}\n\}\n$'
  - name: unchanged-tsconfig-json
    type: regex
    target: { source: file, path: tsconfig.json }
    pattern: '^\{\n  "extends": "@react-native\/typescript-config",\n  "include": \["src"\]\n\}\n$'
  - name: unchanged-src-theme-tokens-ts
    type: regex
    target: { source: file, path: src/theme/tokens.ts }
    pattern: '^export const colors = \{ background: ''#ffffff'', text: ''#111111'', muted: ''#6b7280'', danger: ''#b91c1c'' \};\nexport const spacing = \{ sm: 8, md: 16, lg: 24 \};\n$'
  - name: unchanged-src-api-client-ts
    type: regex
    target: { source: file, path: src/api/client.ts }
    pattern: '^export async function postJson<T>\(path: string, body: unknown\): Promise<T> \{\n  const response = await fetch\(`https:\/\/api\.example\.com\$\{path\}`, \{\n    method: ''POST'',\n    headers: \{ ''Content-Type'': ''application\/json'' \},\n    body: JSON\.stringify\(body\),\n  \}\);\n  if \(!response\.ok\) throw new Error\(`Request failed: \$\{response\.status\}`\);\n  return \(await response\.json\(\)\) as T;\n\}\n$'
